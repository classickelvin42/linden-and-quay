<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Precious and Things</title>
  <meta name="description" content="Send a message to Precious and Things. Messages are stored on the shop server.">
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body data-page="contact">
  <main id="main" class="page prose">
    <p class="eyebrow">Contact</p>
    <h1>Write to the studio</h1>
    <p>No public address or phone number is on file. Add them in <code>data/store.json</code> and in this page before launch.</p>
    <p>Email placeholder: hello@example.com. This address is not monitored.</p>
    <div>
      <form class="contact-form" data-contact novalidate>
        <div class="error-summary" tabindex="-1" hidden>
          <p>Please fix the following:</p>
          <ul></ul>
        </div>
        <label for="name">Name</label>
        <input id="name" name="name" required data-label="Name" autocomplete="name">
        <p class="field-error" id="name-error" hidden></p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required data-label="Email" autocomplete="email">
        <p class="field-error" id="email-error" hidden></p>
        <label for="message">Message</label>
        <textarea id="message" name="message" required minlength="12" data-label="Message" rows="5"></textarea>
        <p class="field-error" id="message-error" hidden></p>
        <div class="hp" aria-hidden="true"><label>Company<input name="company" tabindex="-1" autocomplete="off"></label></div>
        <button class="btn" type="submit">Send message</button>
      </form>
      <div class="form-success" tabindex="-1" hidden>
        <p class="success-copy"></p>
        <button class="text-btn reset-form" type="button">Write another note</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/contact-page.js?v=5"></script>
</body>
</html>
